<svg viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Videa">
  <title>Videa</title>

  <defs>
    <!--
      Rounded play silhouette. The corner radius matches the interface's own
      geometry, and the vertical left edge keeps it reading as a play mark
      rather than a generic triangle.
    -->
    <clipPath id="i2-play">
      <path d="M163.79 177.27 L252.21 246.73 Q264 256 252.21 265.27 L163.79 334.73 Q152 344 152 329 L152 183 Q152 168 163.79 177.27 Z"/>
    </clipPath>
  </defs>

  <!--
    Five bands sliced by the silhouette, so the palette is structural: remove
    a colour and the mark loses a stripe. Gaps are 5 units against 31-unit
    bands, proportional to the smaller mark.
  -->
  <g id="icon" clip-path="url(#i2-play)">
    <rect x="150" y="168.0" width="116" height="31.2" fill="#FFB627"/>
    <rect x="150" y="204.2" width="116" height="31.2" fill="#FF6B3D"/>
    <rect x="150" y="240.4" width="116" height="31.2" fill="#ED2E7E"/>
    <rect x="150" y="276.6" width="116" height="31.2" fill="#A42FC1"/>
    <rect x="150" y="312.8" width="116" height="31.2" fill="#4739D9"/>
  </g>

  <!--
    VIDEA drawn as paths. The site's display face is not a system font, and
    embedding a fallback would mean the logo renders in Arial somewhere.
  -->
  <g id="wordmark" transform="translate(331 192) scale(1.28)" fill="#111318">
    <path d="M0 0 H24 L44 68 L64 0 H88 L55 100 H33 Z"/>
    <path transform="translate(102 0)" d="M0 0 H22 V100 H0 Z"/>
    <path transform="translate(138 0)" fill-rule="evenodd" d="M0 0 H46 C72 0 88 22 88 50 C88 78 72 100 46 100 H0 Z M22 22 V78 H44 C58 78 66 66 66 50 C66 34 58 22 44 22 Z"/>
    <path transform="translate(240 0)" d="M0 0 H80 V22 H22 V39 H70 V61 H22 V78 H80 V100 H0 Z"/>
    <path transform="translate(334 0)" fill-rule="evenodd" d="M34 0 H54 L88 100 H64 L57 79 H31 L24 100 H0 Z M44 20 L53 57 H35 Z"/>
  </g>
</svg>
