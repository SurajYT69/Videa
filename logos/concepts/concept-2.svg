<svg viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Videa">
  <title>Videa - the V is the prism</title>

  <!-- No separate icon. The V does the refracting: an ink beam enters its
       upper left, and the five colours leave as a segmented rule under the
       whole word. Crop to the V for small sizes. -->
  <g id="wordmark" transform="translate(140 156) scale(1.76)" fill="#111318">
    <path d="M0 0 H24 L44 68 L64 0 H88 L55 100 H33 Z"/>
    <path transform="translate(102 0)" d="M0 0 H22 V100 H0 Z"/>
    <path transform="translate(138 0)" fill-rule="evenodd" d="M0 0 H46 C72 0 88 22 88 50 C88 78 72 100 46 100 H0 Z M22 22 V78 H44 C58 78 66 66 66 50 C66 34 58 22 44 22 Z"/>
    <path transform="translate(240 0)" d="M0 0 H80 V22 H22 V39 H70 V61 H22 V78 H80 V100 H0 Z"/>
    <path transform="translate(334 0)" fill-rule="evenodd" d="M34 0 H54 L88 100 H64 L57 79 H31 L24 100 H0 Z M44 20 L53 57 H35 Z"/>
  </g>

  <g id="beam">
    <rect x="44" y="150" width="86" height="14" rx="7" fill="#111318"/>
  </g>

  <g id="spectrum">
    <rect x="140" y="374" width="132" height="14" rx="7" fill="#FFB627"/>
    <rect x="286" y="374" width="132" height="14" rx="7" fill="#FF6B3D"/>
    <rect x="432" y="374" width="132" height="14" rx="7" fill="#ED2E7E"/>
    <rect x="578" y="374" width="132" height="14" rx="7" fill="#A42FC1"/>
    <rect x="724" y="374" width="159" height="14" rx="7" fill="#4739D9"/>
  </g>
</svg>
