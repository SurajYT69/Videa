<svg viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Videa">
  <title>Videa - colour bars</title>

  <defs>
    <clipPath id="c5-screen">
      <rect x="103" y="149" width="214" height="214" rx="34"/>
    </clipPath>
  </defs>

  <!-- Broadcast colour bars held in a screen. A real television reference
       rather than an invented one, and it happens to need exactly five
       colours. Echoes the 12px radius language of the interface. -->
  <g id="icon">
    <g clip-path="url(#c5-screen)">
      <rect x="103" y="149" width="43" height="214" fill="#FFB627"/>
      <rect x="146" y="149" width="43" height="214" fill="#FF6B3D"/>
      <rect x="189" y="149" width="43" height="214" fill="#ED2E7E"/>
      <rect x="232" y="149" width="43" height="214" fill="#A42FC1"/>
      <rect x="275" y="149" width="42" height="214" fill="#4739D9"/>
    </g>
    <rect x="92" y="138" width="236" height="236" rx="45" fill="none" stroke="#111318" stroke-width="22"/>
  </g>

  <g id="wordmark" transform="translate(394 192) scale(1.28)" fill="#111318">
    <path d="M0 0 H24 L44 68 L64 0 H88 L55 100 H33 Z"/>
    <path transform="translate(102 0)" d="M0 0 H22 V100 H0 Z"/>
    <path transform="translate(138 0)" fill-rule="evenodd" d="M0 0 H46 C72 0 88 22 88 50 C88 78 72 100 46 100 H0 Z M22 22 V78 H44 C58 78 66 66 66 50 C66 34 58 22 44 22 Z"/>
    <path transform="translate(240 0)" d="M0 0 H80 V22 H22 V39 H70 V61 H22 V78 H80 V100 H0 Z"/>
    <path transform="translate(334 0)" fill-rule="evenodd" d="M34 0 H54 L88 100 H64 L57 79 H31 L24 100 H0 Z M44 20 L53 57 H35 Z"/>
  </g>
</svg>
